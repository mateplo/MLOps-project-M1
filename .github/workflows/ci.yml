name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  smoke-train:
    name: Smoke training run
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_EXPERIMENT_NAME: adult-income-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock
      - name: Download + validate data
        run: |
          python -m src.data --config configs/config_ci.yaml
          python -m src.validate --config configs/config_ci.yaml
      - name: Train -> promote -> evaluate -> export
        run: |
          python -m src.train --config configs/config_ci.yaml
          python -m src.promote --config configs/config_ci.yaml
          python -m src.evaluate --config configs/config_ci.yaml
          python -m src.export --config configs/config_ci.yaml
      - name: Show metrics
        run: |
          python - <<'PY'
          import json
          m = json.load(open("artifacts/model_meta.json"))
          print(json.dumps({k: m[k] for k in ("version", "decision_threshold", "metrics")}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 7

  docker:
    name: Docker build (+ push on tag)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build train image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: train
          push: false
          cache-from: type=gha
