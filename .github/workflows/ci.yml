name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  smoke-train:
    name: Smoke training run
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_EXPERIMENT_NAME: adult-income-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.lock
      - name: Download + validate data
        run: |
          python -m src.data --config configs/config_ci.yaml
          python -m src.validate --config configs/config_ci.yaml
      - name: Train -> promote -> evaluate -> export
        run: |
          python -m src.train --config configs/config_ci.yaml
          python -m src.promote --config configs/config_ci.yaml
          python -m src.evaluate --config configs/config_ci.yaml
          python -m src.export --config configs/config_ci.yaml
      - name: Show metrics
        run: |
          python - <<'PY'
          import json
          m = json.load(open("artifacts/model_meta.json"))
          print(json.dumps({k: m[k] for k in ("version", "decision_threshold", "metrics")}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 7

  docker:
    name: Docker build (+ push on tag)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.serve.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build serve image (multi-arch on release tags)
        id: serve
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          # linux/arm64 for Apple Silicon / Graviton, linux/amd64 for HF Spaces & most servers.
          # Emulated arm64 builds are slow, so only release tags pay that price.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build train image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: train
          push: false
          cache-from: type=gha

  deploy-space:
    name: Deploy Hugging Face Space
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install huggingface_hub pyyaml python-dotenv
      - name: Point the Space at this release image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          python -m src.deploy_space --image "$IMAGE"

  release:
    name: GitHub Release
    needs: [docker, deploy-space]
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect release facts
        id: facts
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
          SPACE_STATUS: ${{ needs.deploy-space.result }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE" | awk '/Platform:/ {print $2}' | grep -v unknown | sort -u | paste -sd ', ' -)
          MODEL_REPO="${HF_MODEL_REPO:-$(python -c "import yaml;print(yaml.safe_load(open('configs/config.yaml'))['hf']['model_repo'])")}"
          SPACE_REPO="${HF_SPACE_REPO:-$(python -c "import yaml;print(yaml.safe_load(open('configs/config.yaml'))['hf']['space_repo'])")}"
          REVISION=$(grep -E '^MODEL_REVISION=' deploy/space.env | cut -d= -f2)
          {
            echo "## Image"
            echo
            echo '```'
            echo "docker pull $IMAGE"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Platforms | $PLATFORMS |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo
            echo "## Deployment"
            echo
            echo "- Space: https://huggingface.co/spaces/$SPACE_REPO (deploy job: **$SPACE_STATUS**)"
            echo "- Model: https://huggingface.co/$MODEL_REPO @ \`$REVISION\`"
            echo
            echo "## Changes"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          make_latest: true
