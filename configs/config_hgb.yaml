# HistGradientBoosting: fast, handles NaN natively, usually the best ROC-AUC on Adult. Usage: make train CONFIG=configs/config_hgb.yaml
data:
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data
  test_url: https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.test
  csv_path: data/raw.csv
  target: income
  positive_label: ">50K"
  test_size: 0.2
  random_state: 42
  # Columns of the original UCI file (no header in the source)
  columns: [age, workclass, fnlwgt, education, education_num, marital_status, occupation,
            relationship, race, sex, capital_gain, capital_loss, hours_per_week, native_country, income]

# Fail-fast checks on data/raw.csv before training (see src/validate.py)
validation:
  min_rows: 1000
  target_values: ["<=50K", ">50K"]
  positive_rate: [0.15, 0.40]
  max_missing_rate: 0.10
  numeric_ranges:
    age: [16, 100]
    education_num: [1, 16]
    capital_gain: [0, 100000]
    capital_loss: [0, 10000]
    hours_per_week: [1, 99]
  max_cardinality:
    workclass: 10
    sex: 2
    race: 5
    native_country: 50

features:
  # fnlwgt is dropped: it is a census sampling weight, not a property of the person.
  # education is dropped: redundant with education_num (ordinal encoding).
  numeric: [age, education_num, capital_gain, capital_loss, hours_per_week]
  log1p: [capital_gain, capital_loss]        # heavy-tailed -> log1p before scaling
  categorical: [workclass, marital_status, occupation, relationship, race, sex, native_country]
  min_frequency: 0.01                        # one-hot: group categories rarer than 1% (native_country has 41)

model:
  type: hgb
  params:
    learning_rate: [0.05, 0.1]
    max_iter: [200, 400]
    max_leaf_nodes: [15, 31]
    l2_regularization: [0.0, 1.0]

cv:
  strategy: StratifiedKFold
  n_splits: 5
  scoring: roc_auc
  n_jobs: -1

mlflow:
  experiment_name: adult-income
  registered_model_name: AdultIncomeClassifier
  register: true
  challenger_alias: challenger
  champion_alias: champion
  promotion:
    metric: test_roc_auc     # compared on the same held-out split
    min_improvement: 0.0

artifacts:
  dir: artifacts
  model_path: artifacts/model.joblib

# Hugging Face: model repo = distribution of the published champion, space = the running API.
# Override with HF_MODEL_REPO / HF_SPACE_REPO env vars (e.g. in CI).
hf:
  model_repo: mateplo/adult-income-classifier
  space_repo: mateplo/adult-income-classifier
